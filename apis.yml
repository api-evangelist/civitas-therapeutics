name: Civitas Therapeutics
description: Civitas Therapeutics was a privately held biopharmaceutical company founded in 2009 (Chelsea/Cambridge,
  Massachusetts) that developed inhaled therapeutics using the proprietary ARCUS dry-powder pulmonary delivery
  platform. Its lead program, CVT-301, was an inhaled levodopa therapy for the rapid relief of OFF episodes
  in Parkinson's disease patients. The company was acquired by Acorda Therapeutics in 2014 for approximately
  $525 million and no longer operates as an independent entity. It is a life-sciences / drug-development company
  with no public developer platform, API, SDK, or technical integration surface. Surfaced as a portfolio company
  of canaan-partners and retained in the API Evangelist network for provenance.
